org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod properties
mod_version = 2.0.4-release.11
maven_group = lol.richy.threatengl
archives_name = threatengl
enabled_platforms = fabric

# Minecraft properties
minecraft_version = 26.1
# Switched from Yarn to official Mojang mappings since Minecraft 26.1 ships with
# unobfuscated code using real class names (e.g. com.mojang.blaze3d.platform.Window)
# instead of Yarn intermediary names (e.g. net.minecraft.client.util.Window).
# Yarn mappings are no longer needed or available for 26.1.

# Dependencies
fabric_loader_version = 0.18.5
fabric_api_version = 0.144.3+26.1
forge_version = 1.20.4-49.2.0
neoforge_version = 20.4.248
quilt_loader_version = 0.29.1-beta.1
quilted_fabric_api_version = 9.0.0-alpha.8+0.97.0-1.20.4