plugins {
    id 'net.fabricmc.fabric-loom'
}

configurations {
    namedElements {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
}

task commonJar(type: Jar) {
    from sourceSets.main.output
    archiveClassifier = 'common'
}

artifacts {
    namedElements commonJar
}